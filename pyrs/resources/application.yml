# Default PyRS application configuration, loaded via `neutrons_standard.Config`.
#
# Override an individual value by setting the `env` OS environment variable to the
# name (or path) of a `.yml` file whose contents will be deep-merged on top of this
# file -- see `pyrs/utilities/config.py` for how PyRS loads this.

nxstress:
  # Whether NXstress-format (.nxs) output is written.
  enable: true
  extension: ".nxs"
  # Set to true once the nexusformat validator bug affecting production-case field
  # names is resolved.
  use_production_names: false
  # Instrument identity written to the NXstress `instrument/name` field and its
  # `short_name` attribute. These are configuration rather than data because the
  # Hidra project format carries no instrument name at all -- its `instrument`
  # group holds only calibration, geometry and monochromator settings. Overriding
  # them is what makes this writer usable at a beamline other than HB2B without a
  # code change.
  instrument_name: "HB2B"
  instrument_short_name: "HB2B"
  # Names of the fields that tell input workspaces apart when more than one
  # `HidraWorkspace` is written into a single `NXentry`. Each becomes one column on
  # the combined peak index. A value is taken from a matching `HidraWorkspace`
  # `@property` if one exists, otherwise from the sample log of that name -- which
  # must be constant across the workspace's scan points.
  #
  # A name that matches a `HidraWorkspace` property must match a *restorable* one
  # -- a `pyrs.utilities.restorable_property.restorable_property`, which names the
  # backing attribute an I/O reader may write. A plain read-only property is
  # refused when the configuration is read, because its value would be written to
  # the file and then silently lost on the way back: the reconstructed workspace
  # would answer with whatever its constructor defaulted to, and nothing would
  # raise. A name matching no property at all falls through to the sample log and
  # is fine.
  #
  # A name needs no particular spelling: one that is not a Python identifier -- a
  # PV log name such as `BL7:CS:Sample:Dir` -- is encoded reversibly for the
  # on-disk column and recovered exactly on read.
  discriminator_fields: []
  # Only consulted when `discriminator_fields` is empty. False rejects a
  # multi-workspace write outright; true merges the workspaces indistinguishably,
  # and `read()` then returns the single merged workspace rather than N.
  merge_workspaces: false

legacy_io:
  # Whether legacy HidraProject (.h5) output is written.
  enable: true
  extension: ".h5"
