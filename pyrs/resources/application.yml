# Default PyRS application configuration, loaded via `neutrons_standard.Config`.
#
# Override an individual value by setting the `env` OS environment variable to the
# name (or path) of a `.yml` file whose contents will be deep-merged on top of this
# file -- see `pyrs/utilities/config.py` for how PyRS loads this.

nxstress:
  # Whether NXstress-format (.nxs) output is written.
  enable: true
  extension: ".nxs"
  # Set to true once the nexusformat validator bug affecting production-case field
  # names is resolved.
  use_production_names: false
  # Instrument identity written to the NXstress `instrument/name` field and its
  # `short_name` attribute. These are configuration rather than data because the
  # Hidra project format carries no instrument name at all -- its `instrument`
  # group holds only calibration, geometry and monochromator settings. Overriding
  # them is what makes this writer usable at a beamline other than HB2B without a
  # code change.
  instrument_name: "HB2B"
  instrument_short_name: "HB2B"

legacy_io:
  # Whether legacy HidraProject (.h5) output is written.
  enable: true
  extension: ".h5"
