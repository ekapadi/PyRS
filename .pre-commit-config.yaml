# `NXstress.nxdl.xml` is a VERBATIM vendored copy of an upstream artifact
# (nexusformat/definitions). It is excluded so whitespace/format hooks cannot
# alter it -- it must stay byte-identical to upstream to be diffable against it,
# and its sha256 is recorded in IO_prototype.rst.
exclude: "^(pixi\\.lock|docs/developer/source/design/nexus/NXstress\\.nxdl\\.xml)$"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=8192]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: "conda.recipe/meta.yaml"
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  #  - repo: https://github.com/codespell-project/codespell
  #    rev: v2.4.1
  #    hooks:
  #      - id: codespell
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint/
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
  - repo: local
    hooks:
      - id: pixi-lock-check
        name: pixi-lock-check
        entry: bash -c "pixi lock --check"
        stages: [pre-push]
        language: system
